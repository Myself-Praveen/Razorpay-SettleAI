services:
  - type: web
    name: settleai-backend
    env: python
    # We use the python environment directly instead of Docker to easily inject Render's automatic $PORT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: data-volume
      mountPath: /opt/render/project/src/data
      sizeGB: 1
